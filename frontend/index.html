<!DOCTYPE html>
<html lang="pt-BR" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroGraph — Radar Tático de Navegação Aérea</title>

  <!-- Tipografia: Syne + Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>

  <!-- Leaflet Core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Leaflet MarkerCluster (para renderizar milhares de aeroportos estilo GTA/Google Maps sem lag) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Leaflet Curve -->
  <script src="https://unpkg.com/leaflet-curve@1.0.0/leaflet.curve.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #090a0f;
    }

    #fullmap {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
      background-color: #06070a !important;
    }

    /* Tiles Carto Dark de Alta Performance */
    .leaflet-tile {
      filter: brightness(0.75) invert(1) contrast(3.2) hue-rotate(205deg) saturate(0.25);
    }
    .leaflet-container {
      background: #06070a !important;
    }

    /* Pin GTA / Google Maps Style */
    .gta-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #18181b;
      border: 1.5px solid #3f3f46;
      border-radius: 6px;
      color: #f4f4f5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0,0,0,0.7);
      transition: all 150ms ease;
      cursor: pointer;
    }
    .gta-marker:hover {
      transform: scale(1.15) translateY(-2px);
      border-color: #38bdf8;
      background: #0284c7;
      color: #ffffff;
      z-index: 9999 !important;
    }
    .gta-marker.active-pin {
      background: #10b981;
      border-color: #34d399;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
    }

    /* Clusters de Aeroportos */
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: rgba(39, 39, 42, 0.6) !important;
      border: 1px solid rgba(113, 113, 122, 0.4);
    }
    .marker-cluster div {
      background-color: #18181b !important;
      color: #e4e4e7 !important;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }

    /* Animação do Avião / Ponto pulsante ao longo da rota */
    @keyframes planeFlight {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    /* Custom Scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }

    /* Toasts */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      transform: translateY(12px);
      opacity: 0;
      transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden text-zinc-300 antialiased font-sans select-none">

  <div id="toast-container" aria-live="polite"></div>

  <!-- 1. MAPA FULLSCREEN EM TODA A TELA (COMO GOOGLE MAPS / GTA) -->
  <div id="fullmap"></div>

  <!-- 2. PAINEL FLUTUANTE NO CANTO SUPERIOR ESQUERDO (GOOGLE MAPS STYLE) -->
  <aside 
    id="searchCard" 
    class="absolute top-4 left-4 z-20 w-[390px] max-w-[calc(100vw-32px)] max-h-[calc(100vh-32px)] flex flex-col bg-zinc-950/95 backdrop-blur-2xl border border-zinc-800/90 rounded-2xl shadow-2xl overflow-hidden transition-all duration-300"
  >
    <!-- Header do Painel -->
    <div class="p-4 border-b border-zinc-800/80 flex items-center justify-between bg-zinc-900/40">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-700/80 flex items-center justify-center text-zinc-100 shadow-sm">
          <i data-lucide="plane" class="w-4 h-4 text-zinc-200"></i>
        </div>
        <div>
          <span class="font-display font-bold text-xs tracking-wider text-zinc-100 uppercase block">AeroGraph</span>
          <span class="text-[10px] font-mono text-zinc-500">Radar Global • 3.224 Aeroportos</span>
        </div>
      </div>
      
      <button 
        type="button" 
        id="toggleCollapseBtn" 
        class="w-7 h-7 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 flex items-center justify-center transition"
        title="Minimizar / Expandir Painel"
      >
        <i data-lucide="chevron-up" id="collapseIcon" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Seletor de Moeda (Dólar, Real, Euro, Libra) -->
    <div class="px-4 py-2 border-b border-zinc-800/60 bg-zinc-950 flex items-center justify-between text-xs font-mono">
      <span class="text-[11px] text-zinc-500 uppercase flex items-center gap-1.5">
        <i data-lucide="coins" class="w-3.5 h-3.5 text-zinc-400"></i> Moeda
      </span>
      <div class="flex items-center gap-1 bg-zinc-900 p-0.5 rounded-lg border border-zinc-800 text-[10px]">
        <button type="button" onclick="setCurrency('BRL')" id="curr-BRL" class="curr-btn px-2 py-0.5 rounded font-bold transition bg-zinc-100 text-zinc-950">BRL R$</button>
        <button type="button" onclick="setCurrency('USD')" id="curr-USD" class="curr-btn px-2 py-0.5 rounded font-bold transition text-zinc-400 hover:text-white">USD $</button>
        <button type="button" onclick="setCurrency('EUR')" id="curr-EUR" class="curr-btn px-2 py-0.5 rounded font-bold transition text-zinc-400 hover:text-white">EUR €</button>
        <button type="button" onclick="setCurrency('GBP')" id="curr-GBP" class="curr-btn px-2 py-0.5 rounded font-bold transition text-zinc-400 hover:text-white">GBP £</button>
      </div>
    </div>

    <!-- Conteúdo Roolável do Painel -->
    <div id="panelBody" class="p-4 overflow-y-auto custom-scroll space-y-4">
      
      <!-- Linhas de Busca Origem / Destino conectadas com Linha Vertical (Google Maps Bus Route style) -->
      <form id="radarForm" class="space-y-3" novalidate>
        
        <div class="relative flex items-stretch">
          
          <!-- Linha vertical conectando origem e destino -->
          <div class="w-6 flex flex-col items-center justify-between py-3 mr-1 shrink-0">
            <div class="w-2.5 h-2.5 rounded-full border-2 border-emerald-400 bg-emerald-950"></div>
            <div class="w-0.5 flex-1 bg-zinc-700/60 my-1"></div>
            <div class="w-2.5 h-2.5 rounded-sm border-2 border-sky-400 bg-sky-950"></div>
          </div>

          <!-- Campos de Input com Autocomplete -->
          <div class="flex-1 space-y-2">
            
            <!-- Origem -->
            <div class="relative">
              <input 
                type="text" 
                id="originInput"
                placeholder="Origem (Ex: Florianópolis, GRU, Paris...)" 
                autocomplete="off"
                required
                class="w-full h-10 bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 text-xs text-zinc-100 font-medium placeholder:text-zinc-500 focus:outline-none focus:border-zinc-500 transition-colors"
              />
              <input type="hidden" id="originCode" value="FLN">
              <span id="originBadge" class="absolute right-2.5 top-2.5 text-[10px] font-mono font-bold text-zinc-400 bg-zinc-950 px-1.5 py-0.5 rounded border border-zinc-800">FLN</span>
              <ul id="originResults" class="hidden absolute left-0 right-0 top-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl z-50 max-h-48 overflow-y-auto custom-scroll text-xs divide-y divide-zinc-800/40"></ul>
            </div>

            <!-- Destino -->
            <div class="relative">
              <input 
                type="text" 
                id="destInput"
                placeholder="Destino (Ex: Rio de Janeiro, NRT, JFK...)" 
                autocomplete="off"
                required
                class="w-full h-10 bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 text-xs text-zinc-100 font-medium placeholder:text-zinc-500 focus:outline-none focus:border-zinc-500 transition-colors"
              />
              <input type="hidden" id="destCode" value="GIG">
              <span id="destBadge" class="absolute right-2.5 top-2.5 text-[10px] font-mono font-bold text-zinc-400 bg-zinc-950 px-1.5 py-0.5 rounded border border-zinc-800">GIG</span>
              <ul id="destResults" class="hidden absolute left-0 right-0 top-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl z-50 max-h-48 overflow-y-auto custom-scroll text-xs divide-y divide-zinc-800/40"></ul>
            </div>

          </div>

          <!-- Botão Inverter Lateral -->
          <div class="flex items-center pl-2 shrink-0">
            <button 
              type="button" 
              id="swapBtn"
              title="Inverter Posições"
              class="w-8 h-8 rounded-lg border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 flex items-center justify-center transition"
            >
              <i data-lucide="arrow-up-down" class="w-3.5 h-3.5"></i>
            </button>
          </div>

        </div>

        <!-- Botão Direto de Traçar Rota -->
        <div class="pt-1">
          <button 
            type="submit" 
            id="searchBtn"
            class="w-full h-10 px-4 rounded-xl bg-zinc-100 hover:bg-white text-zinc-950 font-bold text-xs font-mono transition shadow flex items-center justify-center gap-2 active:scale-[0.98]"
          >
            <i data-lucide="navigation" class="w-3.5 h-3.5 fill-zinc-950"></i>
            <span>Calcular Melhores Rotas</span>
          </button>
        </div>

      </form>

      <!-- ÁREA DE RESULTADOS ESTILO GOOGLE MAPS TRANSIT -->
      <div id="resultsWrapper" class="space-y-3 pt-2 border-t border-zinc-900">
        
        <!-- Estado Inicial -->
        <div id="stateEmpty" class="text-center py-6 text-zinc-500 text-xs">
          <p class="font-mono text-[11px] uppercase tracking-wider text-zinc-500">Clique em qualquer aeroporto no mapa</p>
          <p class="text-[10px] text-zinc-600 mt-1">Ou use o formulário acima para traçar a melhor rota global.</p>
        </div>

        <!-- Loading -->
        <div id="stateLoading" class="hidden py-6 text-center space-y-2">
          <div class="w-6 h-6 border-2 border-zinc-700 border-t-zinc-200 rounded-full animate-spin mx-auto"></div>
          <p class="text-[11px] font-mono text-zinc-400">Calculando K-Shortest Paths...</p>
        </div>

        <!-- Alternativas K-Paths (Abas estilo Google Maps: Ônibus/Metrô) -->
        <div id="routeResults" class="hidden space-y-3">
          
          <div class="text-[10px] font-mono uppercase tracking-wider text-zinc-500 flex items-center justify-between">
            <span>Rotas Alternativas Calculadas</span>
            <span id="routeCount" class="text-zinc-400">3 Opções</span>
          </div>

          <!-- Cards das 3 opções -->
          <div id="transitCards" class="space-y-2"></div>

          <!-- ITINERÁRIO DETALHADO DO VOO (Estilo Google Maps Viagem) -->
          <div id="itineraryDetail" class="pt-2 border-t border-zinc-900 space-y-3"></div>

        </div>

      </div>

    </div>

    <!-- Footer do Card -->
    <div class="px-4 py-2.5 border-t border-zinc-800/80 bg-zinc-950 text-[10px] font-mono text-zinc-500 flex items-center justify-between">
      <span>Dijkstra Engine Online</span>
      <span class="text-emerald-400 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> 15ms latency
      </span>
    </div>

  </aside>

  <!-- 3. CONTROLE RÁPIDO DO MAPA NO CANTO INFERIOR DIREITO -->
  <div class="absolute bottom-6 right-6 z-20 flex flex-col gap-2">
    <button 
      id="resetViewBtn" 
      class="p-2.5 rounded-xl bg-zinc-950/90 hover:bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white shadow-xl backdrop-blur transition"
      title="Restaurar Visão Global"
    >
      <i data-lucide="globe" class="w-4 h-4"></i>
    </button>
  </div>

  <script>
    // Inicialização do Mapa Fullscreen
    const map = L.map('fullmap', {
      center: [-10, -50],
      zoom: 4,
      minZoom: 2,
      maxZoom: 10,
      zoomControl: false,
      attributionControl: false
    });

    // Tiles Carto Dark sem poluição visual
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Controles de Zoom no canto inferior esquerdo
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Cluster de Aeroportos (renderiza 3.200 aeroportos como lojinhas do GTA)
    const airportClusterGroup = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 40,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      iconCreateFunction: function(cluster) {
        const count = cluster.getChildCount();
        return L.divIcon({
          html: `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-zinc-900 border border-zinc-700 text-zinc-300 font-mono text-xs font-bold shadow-lg">${count}</div>`,
          className: 'custom-cluster',
          iconSize: L.point(32, 32)
        });
      }
    });
    map.addLayer(airportClusterGroup);

    // Grupo de Camadas para as Linhas de Voo
    const flightPathGroup = L.layerGroup().addTo(map);

    // Toast Sonner
    const toast = {
      show(title, desc = '', isError = false) {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast max-w-xs w-full rounded-xl border p-3 shadow-2xl flex items-start gap-2.5 text-xs ${
          isError ? 'border-red-900/80 bg-zinc-900 text-zinc-100' : 'border-zinc-800 bg-zinc-900 text-zinc-200'
        }`;
        el.innerHTML = `
          <i data-lucide="${isError ? 'alert-circle' : 'check-circle'}" class="w-4 h-4 shrink-0 mt-0.5 text-zinc-400"></i>
          <div class="flex-1 space-y-0.5">
            <div class="font-medium text-zinc-200">${title}</div>
            ${desc ? `<div class="text-[11px] text-zinc-400">${desc}</div>` : ''}
          </div>
        `;
        container.appendChild(el);
        lucide.createIcons({ root: el });
        setTimeout(() => el.classList.add('show'), 10);
        setTimeout(() => {
          el.classList.remove('show');
          setTimeout(() => el.remove(), 200);
        }, 3200);
      },
      success(title, desc) { this.show(title, desc, false); },
      error(title, desc) { this.show(title, desc, true); }
    };

    let airportCatalog = [];
    let airportMap = {};
    let markerMap = {};
    let currentMultiRoute = null;
    let selectedRouteIndex = 0;

    // Conversão de Moedas em Tempo Real
    let currentCurrency = "BRL";
    const exchangeRates = {
      BRL: { rate: 5.75, symbol: "R$ ", prefix: true },
      USD: { rate: 1.0, symbol: "$", prefix: true },
      EUR: { rate: 0.92, symbol: "€", prefix: false },
      GBP: { rate: 0.79, symbol: "£", prefix: true }
    };

    function formatPrice(usdPrice) {
      const curr = exchangeRates[currentCurrency] || exchangeRates.BRL;
      const converted = Math.round(usdPrice * curr.rate);
      const formatted = converted.toLocaleString("pt-BR");
      return curr.prefix ? (curr.symbol + formatted) : (formatted + " " + curr.symbol);
    }

    window.setCurrency = function(code) {
      currentCurrency = code;
      document.querySelectorAll(".curr-btn").forEach(btn => {
        btn.className = "curr-btn px-2 py-0.5 rounded font-bold transition text-zinc-400 hover:text-white";
      });
      const active = document.getElementById("curr-" + code);
      if (active) active.className = "curr-btn px-2 py-0.5 rounded font-bold transition bg-zinc-100 text-zinc-950";

      if (currentMultiRoute) {
        renderRouteCards(currentMultiRoute);
      }
      toast.success("Moeda Alterada", "Valores agora em " + code);
    };

    // Carregamento de Aeroportos e Povoamento do Mapa GTA
    async function initRadar() {
      try {
        const res = await fetch('/airports');
        if (!res.ok) throw new Error('Não foi possível obter os dados da malha.');
        airportCatalog = await res.json();

        const markers = [];

        airportCatalog.forEach(a => {
          airportMap[a.iata] = a;

          if (a.lat !== 0 && a.lon !== 0) {
            // Ícone estilo pin do GTA com o código IATA
            const icon = L.divIcon({
              className: 'custom-pin',
              html: `<div class="gta-marker px-1.5 py-0.5" id="pin-${a.iata}">✈ ${a.iata}</div>`,
              iconSize: [46, 20],
              iconAnchor: [23, 10]
            });

            const marker = L.marker([a.lat, a.lon], { icon: icon });
            marker.bindPopup(`
              <div class="p-2 font-mono text-xs space-y-1">
                <div class="font-bold text-sm text-zinc-100 flex items-center gap-1.5">
                  <span>✈</span> ${a.iata} — ${a.city}
                </div>
                <div class="text-zinc-400 text-[11px]">${a.country}</div>
                <div class="pt-2 flex gap-1.5">
                  <button onclick="setAsOrigin('${a.iata}')" class="px-2 py-1 rounded bg-emerald-950 text-emerald-300 border border-emerald-800 text-[10px] font-bold hover:bg-emerald-900">
                    Definir Origem
                  </button>
                  <button onclick="setAsDest('${a.iata}')" class="px-2 py-1 rounded bg-sky-950 text-sky-300 border border-sky-800 text-[10px] font-bold hover:bg-sky-900">
                    Definir Destino
                  </button>
                </div>
              </div>
            `);

            markerMap[a.iata] = marker;
            markers.push(marker);
          }
        });

        airportClusterGroup.addLayers(markers);

        // Define valores padrão e dispara primeira rota automática
        setAirport('origin', 'FLN');
        setAirport('dest', 'GIG');
        triggerSearch();

      } catch (err) {
        toast.error('Erro de Inicialização', err.message);
      }
    }

    window.setAsOrigin = function(code) {
      setAirport('origin', code);
      map.closePopup();
      toast.success('Origem Definida', `${code} selecionado como partida.`);
    };

    window.setAsDest = function(code) {
      setAirport('dest', code);
      map.closePopup();
      toast.success('Destino Definido', `${code} selecionado como chegada.`);
      triggerSearch();
    };

    function setAirport(type, code) {
      const a = airportMap[code];
      if (!a) return;
      document.getElementById(`${type}Code`).value = a.iata;
      document.getElementById(`${type}Input`).value = `${a.city} (${a.iata})`;
      document.getElementById(`${type}Badge`).textContent = a.iata;
    }

    // Autocomplete
    function setupAutocomplete(type) {
      const input = document.getElementById(`${type}Input`);
      const results = document.getElementById(`${type}Results`);

      input.addEventListener('input', () => {
        const term = input.value.trim().toLowerCase();
        if (term.length < 2) {
          results.classList.add('hidden');
          return;
        }

        const matches = airportCatalog.filter(a => 
          a.iata.toLowerCase().includes(term) ||
          a.city.toLowerCase().includes(term) ||
          a.country.toLowerCase().includes(term)
        ).slice(0, 10);

        results.innerHTML = '';
        if (matches.length === 0) {
          results.innerHTML = '<li class="px-3 py-2 text-zinc-500 text-[11px]">Nenhum aeroporto</li>';
        } else {
          matches.forEach(m => {
            const li = document.createElement('li');
            li.className = 'px-3 py-2 hover:bg-zinc-800 cursor-pointer flex items-center justify-between transition-colors';
            li.innerHTML = `
              <div>
                <span class="font-medium text-zinc-200">${m.city}</span>
                <span class="text-zinc-500 text-[10px] ml-1">${m.country}</span>
              </div>
              <span class="font-mono font-bold text-[10px] text-zinc-400 bg-zinc-950 px-1.5 py-0.5 rounded border border-zinc-800">${m.iata}</span>
            `;
            li.addEventListener('click', () => {
              setAirport(type, m.iata);
              results.classList.add('hidden');
            });
            results.appendChild(li);
          });
        }
        results.classList.remove('hidden');
      });

      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !results.contains(e.target)) {
          results.classList.add('hidden');
        }
      });
    }

    setupAutocomplete('origin');
    setupAutocomplete('dest');

    document.getElementById('swapBtn').addEventListener('click', () => {
      const oCode = document.getElementById('originCode').value;
      const dCode = document.getElementById('destCode').value;
      setAirport('origin', dCode);
      setAirport('dest', oCode);
      toast.success('Inversão Efetuada', `${dCode} ➔ ${oCode}`);
      triggerSearch();
    });

    document.getElementById('resetViewBtn').addEventListener('click', () => {
      map.setView([-10, -50], 4);
    });

    // Minimizar / Expandir Painel
    let isCollapsed = false;
    document.getElementById('toggleCollapseBtn').addEventListener('click', () => {
      isCollapsed = !isCollapsed;
      const panel = document.getElementById('panelBody');
      const icon = document.getElementById('collapseIcon');
      if (isCollapsed) {
        panel.classList.add('hidden');
        icon.setAttribute('data-lucide', 'chevron-down');
      } else {
        panel.classList.remove('hidden');
        icon.setAttribute('data-lucide', 'chevron-up');
      }
      lucide.createIcons();
    });

    // Desenhar Rota Geodésica no Mapa
    function renderRouteOnMap(route) {
      flightPathGroup.clearLayers();
      const bounds = L.latLngBounds();

      // Remove destaque anterior
      document.querySelectorAll('.gta-marker').forEach(el => el.classList.remove('active-pin'));

      route.path.forEach((code, idx) => {
        const a = airportMap[code];
        if (!a || (a.lat === 0 && a.lon === 0)) return;

        bounds.extend([a.lat, a.lon]);

        const pin = document.getElementById(`pin-${code}`);
        if (pin) pin.classList.add('active-pin');

        // Marcador luminoso no nó
        const isOrigin = idx === 0;
        const isDest = idx === route.path.length - 1;
        const color = isOrigin ? '#34d399' : (isDest ? '#38bdf8' : '#fbbf24');

        L.circleMarker([a.lat, a.lon], {
          radius: isOrigin || isDest ? 7 : 5,
          fillColor: color,
          color: '#090a0f',
          weight: 2,
          opacity: 1,
          fillOpacity: 1
        }).addTo(flightPathGroup).bindPopup(`<strong>${a.iata}</strong> — ${a.city}`);
      });

      // Desenha arcos de voo
      route.segments.forEach(seg => {
        if (seg.from_lat === 0 || seg.to_lat === 0) return;

        const midLat = (seg.from_lat + seg.to_lat) / 2 + (Math.abs(seg.to_lon - seg.from_lon) > 20 ? 8 : 2);
        const midLon = (seg.from_lon + seg.to_lon) / 2;

        L.curve(
          ['M', [seg.from_lat, seg.from_lon], 'Q', [midLat, midLon], [seg.to_lat, seg.to_lon]],
          {
            color: '#38bdf8',
            weight: 3,
            opacity: 0.9,
            dashArray: '8, 8'
          }
        ).addTo(flightPathGroup);
      });

      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [80, 80] });
      }
    }

    // Renderizar Abas de Opções Estilo Google Maps Transit
    function renderRouteCards(data) {
      currentMultiRoute = data;
      selectedRouteIndex = 0;

      const container = document.getElementById('transitCards');
      container.innerHTML = '';

      data.routes.forEach((route, idx) => {
        const isSelected = idx === 0;
        const card = document.createElement('div');
        card.className = `transit-card p-3 rounded-xl border cursor-pointer transition-all ${
          isSelected 
            ? 'border-sky-500 bg-sky-950/30 shadow-md ring-1 ring-sky-500/50' 
            : 'border-zinc-800 bg-zinc-900/50 hover:bg-zinc-900'
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded font-bold ${
                idx === 0 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-zinc-800 text-zinc-400'
              }">
                ${idx === 0 ? '★ Recomendada' : `Opção ${idx + 1}`}
              </span>
              <span class="text-[11px] font-mono text-zinc-400 font-bold">${route.stops === 0 ? 'Direto' : `${route.stops} escala(s)`}</span>
            </div>
            <div class="font-mono font-bold text-sm text-white">${formatPrice(route.total_price)}</div>
          </div>

          <div class="flex items-center justify-between text-[11px] font-mono text-zinc-400">
            <div class="flex items-center gap-1">
              <i data-lucide="clock" class="w-3 h-3 text-zinc-500"></i>
              <span>${route.total_duration}h de viagem</span>
            </div>
            <div class="truncate max-w-[170px] text-zinc-500 text-[10px]">
              ${route.path.join(' → ')}
            </div>
          </div>
        `;

        card.addEventListener('click', () => {
          document.querySelectorAll('.transit-card').forEach((el, i) => {
            if (i === idx) {
              el.className = 'transit-card p-3 rounded-xl border cursor-pointer transition-all border-sky-500 bg-sky-950/30 shadow-md ring-1 ring-sky-500/50';
            } else {
              el.className = 'transit-card p-3 rounded-xl border cursor-pointer transition-all border-zinc-800 bg-zinc-900/50 hover:bg-zinc-900';
            }
          });
          selectedRouteIndex = idx;
          renderItinerary(data.routes[idx]);
          renderRouteOnMap(data.routes[idx]);
        });

        container.appendChild(card);
      });

      renderItinerary(data.routes[0]);
      renderRouteOnMap(data.routes[0]);
      lucide.createIcons();
    }

    // Renderizar o Itinerário Detalhado Estilo Viagem do Google Maps
    function renderItinerary(route) {
      const container = document.getElementById('itineraryDetail');
      
      let segmentsHtml = '';
      route.segments.forEach((seg, i) => {
        const src = airportMap[seg.from_airport] || { city: seg.from_airport };
        const dst = airportMap[seg.to_airport] || { city: seg.to_airport };

        segmentsHtml += `
          <div class="relative pl-6 pb-4 last:pb-0">
            <!-- Linha vertical da conexão -->
            <div class="absolute left-2 top-2.5 bottom-0 w-0.5 bg-zinc-800 last:hidden"></div>
            <!-- Ponto do nó -->
            <div class="absolute left-0.5 top-1.5 w-3.5 h-3.5 rounded-full bg-zinc-900 border-2 border-sky-400 flex items-center justify-center">
              <div class="w-1 h-1 rounded-full bg-sky-400"></div>
            </div>

            <div class="space-y-1">
              <div class="flex items-center justify-between text-xs font-semibold text-zinc-200">
                <span>${seg.from_airport} — ${src.city}</span>
                <span class="font-mono text-[11px] text-zinc-400">${formatPrice(seg.price)}</span>
              </div>
              <div class="text-[11px] font-mono text-zinc-500 flex items-center gap-2">
                <span>Voo Direto (${seg.duration}h)</span>
                <span>•</span>
                <span class="text-zinc-600">Comercial Regular</span>
              </div>
              <div class="text-xs font-semibold text-zinc-300 pt-1">
                ➔ ${seg.to_airport} — ${dst.city}
              </div>
            </div>
          </div>
        `;
      });

      // Deep-links oficiais dinâmicos para cotação em tempo real (Sem cadastro / Sem chave)
      const originCode = route.path[0];
      const destCode = route.path[route.path.length - 1];
      
      // Data padrão: 15 dias no futuro
      const today = new Date();
      today.setDate(today.getDate() + 15);
      const dateStr = today.toISOString().split("T")[0];
      
      const googleFlightsUrl = `https://www.google.com/travel/flights?q=Flights%20to%20${destCode}%20from%20${originCode}%20on%20${dateStr}`;
      const skyScannerUrl = `https://www.skyscanner.com.br/transporte/passagens-aereas/${originCode.toLowerCase()}/${destCode.toLowerCase()}/`;

      container.innerHTML = `
        <div class="p-3.5 rounded-xl bg-zinc-900/70 border border-zinc-800/80 space-y-3">
          <div class="flex items-center justify-between text-xs font-mono">
            <span class="font-bold text-zinc-200 uppercase tracking-wider">Itinerário da Rota</span>
            <span class="text-emerald-400 font-bold">${formatPrice(route.total_price)}</span>
          </div>

          <div class="pt-1">
            ${segmentsHtml}
          </div>

          <!-- Cotação Real em Tempo Real (Google Flights Live Engine) -->
          <div class="pt-2 border-t border-zinc-800/80 space-y-2.5">
            <div class="text-[10px] font-mono text-zinc-500 uppercase flex items-center justify-between">
              <span>Verificação de Mercado em Tempo Real</span>
              <span class="text-emerald-400 font-bold flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Google Flights Live
              </span>
            </div>

            <!-- Caixa onde o preço real é injetado -->
            <div id="liveQuoteBox" class="p-2.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs font-mono flex items-center justify-between">
              <div class="text-zinc-400 flex items-center gap-2">
                <i data-lucide="radar" class="w-4 h-4 text-sky-400"></i>
                <span>Consultar cotação oficial do dia</span>
              </div>
              <button 
                type="button" 
                id="btnFetchLive" 
                onclick="getLiveQuote('${originCode}', '${destCode}')"
                class="px-2.5 py-1 rounded bg-zinc-100 hover:bg-white text-zinc-950 font-bold text-[11px] transition active:scale-95 shadow"
              >
                Buscar Preço Real
              </button>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <a 
                href="${googleFlightsUrl}" 
                target="_blank" 
                rel="noopener noreferrer"
                class="px-3 py-1.5 rounded-lg bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-zinc-200 text-[11px] font-mono flex items-center justify-center gap-1.5 transition"
              >
                <i data-lucide="external-link" class="w-3 h-3 text-sky-400"></i>
                <span>Abrir Google Flights</span>
              </a>
              <a 
                href="${skyScannerUrl}" 
                target="_blank" 
                rel="noopener noreferrer"
                class="px-3 py-1.5 rounded-lg bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-zinc-200 text-[11px] font-mono flex items-center justify-center gap-1.5 transition"
              >
                <i data-lucide="external-link" class="w-3 h-3 text-emerald-400"></i>
                <span>Abrir Skyscanner</span>
              </a>
            </div>
          </div>
        </div>
      `;
    }

    // Disparo de Busca
    async function triggerSearch() {
      const origin = document.getElementById('originCode').value;
      const destination = document.getElementById('destCode').value;
      
      if (!origin || !destination) return;

      const sEmpty = document.getElementById('stateEmpty');
      const sLoading = document.getElementById('stateLoading');
      const rResults = document.getElementById('routeResults');

      sEmpty.classList.add('hidden');
      rResults.classList.add('hidden');
      sLoading.classList.remove('hidden');

      try {
        const res = await fetch(`/search?origin=${origin}&destination=${destination}`);
        const data = await res.json();

        sLoading.classList.add('hidden');

        if (!res.ok) {
          toast.error('Rota Indisponível', data.detail);
          sEmpty.classList.remove('hidden');
          return;
        }

        renderRouteCards(data);
        rResults.classList.remove('hidden');
        toast.success('Radar Atualizado', `${data.total_found} alternativas traçadas no mapa.`);

      } catch (err) {
        sLoading.classList.add('hidden');
        sEmpty.classList.remove('hidden');
        toast.error('Erro de Rede', err.message);
      }
    }

    document.getElementById('radarForm').addEventListener('submit', (e) => {
      e.preventDefault();
      triggerSearch();
    });

    initRadar();
    lucide.createIcons();
  </script>
</body>
</html>
